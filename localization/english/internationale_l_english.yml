 je_blanquist_reform_bureaucracy_desc: "Cancel any current law enactment and begin enacting [GetLawType('law_blanquist_bureaucracy').GetName]."
 je_blanquist_reform_atheism: "Begin Atheist Reform"
 je_blanquist_reform_atheism_desc: "Cancel any current law enactment and begin enacting [GetLawType('law_blanquist_state_atheism').GetName]."
 je_blanquist_reform_economy: "Begin Economic Reform"
