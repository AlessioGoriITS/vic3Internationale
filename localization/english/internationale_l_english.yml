 intl_delegate_mutualist_title: "Pierre-Joseph Proudhon · Economist"
 intl_delegate_syndicalist_name: "Fernand Pelloutier"
 intl_delegate_syndicalist_role: "Union Organizer"
 intl_delegate_syndicalist_title: "Fernand Pelloutier · Union Organizer"
 intl_delegate_blanquist_name: "Louis-Auguste Blanqui"
 intl_delegate_blanquist_role: "Conspirator"
 intl_delegate_blanquist_title: "Louis-Auguste Blanqui · Conspirator"
 intl_delegate_marxist_name: "Karl Marx"
 intl_delegate_marxist_role: "Theorist"
 intl_delegate_marxist_title: "Karl Marx · Theorist"
 intl_doctrine_anarchist: "Mikhail preaches the immediate dissolution of all state apparatus. The revolution needs no vanguard — only the spontaneous will of the oppressed, acting in free federation. All authority is tyranny; all hierarchy, an affront to human dignity."
 intl_doctrine_mutualist: "Property is theft — but its abolition must come through fair exchange and workers' mutual credit banks, not violent seizure. Through federated cooperatives and equitable contracts, the labourer shall reclaim the full product of his toil."
 intl_doctrine_syndicalist: "The union is the embryo of the new society. Through the general strike and industrial sabotage the workers shall reclaim what is rightfully theirs. The trade union, not the party, is the vehicle of emancipation."
 intl_doctrine_blanquist: "The masses are not yet ready. A dedicated revolutionary vanguard must seize power by force, then exercise a temporary dictatorship to educate the people and dismantle the old order before genuine liberty can be established."
 intl_doctrine_marxist: "Historical materialism reveals the inevitable collapse of capitalism. The proletariat must seize state power and wield it as a weapon of class struggle until all class distinctions are abolished and the state itself withers away."
 intl_detail_placeholder: "Select a faction or delegate to read their doctrine."
 intl_footer_text: "Workers of the world, unite!"
