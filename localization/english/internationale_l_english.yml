 je_internationale: "The Internationale"
 je_internationale_reason: "The workers of the world stir. Across borders and beyond the reach of any single government, the cause of labour organises itself into something larger — a fraternity of the dispossessed, bound not by nation but by class. How we answer their call will define the century."
 je_internationale_complete_tt: "The Internationale has achieved its aims"
 internationale_open_button: "Convene the Internationale"
 internationale_open_button_tt: "Open the Internationale management window"
 intl_parliament_title: "Congress of the Internationale"
 intl_parliament_desc: "The balance of tendencies within the Workers' International"
 intl_parliament_tooltip: "Representation of ideological factions within the Internationale.\nEach faction's strength shapes the direction of the movement.\n\n#bold Anarchist:#! #variable [GetPlayer.MakeScope.Var('intl_strength_anarchist').GetValue]#!%\n#bold Mutualist:#! #variable [GetPlayer.MakeScope.Var('intl_strength_mutualist').GetValue]#!%\n#bold Syndicalist:#! #variable [GetPlayer.MakeScope.Var('intl_strength_syndicalist').GetValue]#!%\n#bold Blanquist:#! #variable [GetPlayer.MakeScope.Var('intl_strength_blanquist').GetValue]#!%\n#bold Marxist:#! #variable [GetPlayer.MakeScope.Var('intl_strength_marxist').GetValue]#!%"
